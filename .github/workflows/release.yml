name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-aot:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-22.04
            archive: tar.gz
            binary: DotnetTerminalExplorer
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            archive: tar.gz
            binary: DotnetTerminalExplorer
          - rid: osx-arm64
            os: macos-14
            archive: tar.gz
            binary: DotnetTerminalExplorer
          - rid: win-x64
            os: windows-latest
            archive: zip
            binary: DotnetTerminalExplorer.exe
          - rid: win-arm64
            os: windows-latest
            archive: zip
            binary: DotnetTerminalExplorer.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          SEMVER="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "SEMVER=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Publish Native AOT
        shell: bash
        run: |
          dotnet publish src/DotnetTerminalExplorer \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Version="${{ steps.version.outputs.SEMVER }}" \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -o ./dist

      - name: Rename executable to dte (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f "./dist/DotnetTerminalExplorer" ]; then
            mv "./dist/DotnetTerminalExplorer" "./dist/dte"
          fi

      - name: Rename executable to dte (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "./dist/DotnetTerminalExplorer.exe") {
            Move-Item "./dist/DotnetTerminalExplorer.exe" "./dist/dte.exe" -Force
          }

      - name: Ad-hoc Code Sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign -s - --force --deep ./dist/dte

      - name: Package archive (.tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="dte-${{ steps.version.outputs.TAG }}-${{ matrix.rid }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C ./dist .
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package archive (.zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archiveName = "dte-${{ steps.version.outputs.TAG }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path ./dist/* -DestinationPath $archiveName -Force
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dte-${{ matrix.rid }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-aot
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG }}
          name: Dotnet Terminal Explorer ${{ steps.release_tag.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
