name: Publish to NuGet.org

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pack-publish:
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotnetTerminalExplorer.sln

      - name: Build
        run: dotnet build DotnetTerminalExplorer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DotnetTerminalExplorer.sln --configuration Release --no-build --no-restore

      - name: Pack
        run: >-
          dotnet pack src/DotnetTerminalExplorer/DotnetTerminalExplorer.csproj
          --configuration Release
          --no-build
          --include-symbols
          --include-source
          --output nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: DotnetTerminalExplorer-packages
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error

      - name: Push package to NuGet.org
        run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
